services:
  frontend:
    ports:
      - "443:443"

    volumes:
      - type: bind
        source: ./nginx.https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

      - type: bind
        source: ${NGINX_CERT_DIR:?NGINX_CERT_DIR is required}/server.crt
        target: /etc/nginx/ssl/server.crt
        read_only: true

      - type: bind
        source: ${NGINX_CERT_DIR:?NGINX_CERT_DIR is required}/server.key
        target: /etc/nginx/ssl/server.key
        read_only: true
